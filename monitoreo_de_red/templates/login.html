{% load static %}

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <main class="login d-flex flex-column align-items-center min-vh-100 position-relative overflow-hidden pt-5 px-3" aria-labelledby="login-title">
      <div class="login__glow" aria-hidden="true"></div>
      <div class="login__frame position-relative w-100 mx-auto">
        <div class="login__card d-flex justify-content-between flex-column position-relative w-100 mx-auto" data-card>
          <div data-view>
            <h1 class="login__title fw-semibold text-center mb-* m-0" id="login-title">Iniciar sesión</h1>
            <form class="login__form" data-form novalidate>
              {% csrf_token %}
              <div class="login__field mb-3" data-field>
                <label class="login__label form-label" for="login-username">Nombre de usuario</label>
                <input class="login__input form-control" id="login-username" name="username" type="text" autocomplete="username" required placeholder="John Doe" data-msg="Ingrese su nombre de usuario." aria-describedby="login-username-err" />
                <p class="login__error" id="login-username-err" data-error></p>
              </div>
              <div class="login__field mb-3" data-field>
                <div class="login__row d-flex justify-content-between align-items-baseline">
                  <label class="login__label form-label" for="login-pw">Contraseña</label>
                </div>
                <div class="login__pw">
                  <input class="login__input form-control" id="login-pw" name="password" type="password" autocomplete="current-password" required placeholder="Ingrese su contraseña" data-msg="Ingrese su contraseña." aria-describedby="login-pw-err" />
                  <button class="login__eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="login-pw" data-pw-toggle>
                    <svg class="login__eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="login__eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 3l18 18" />
                      <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16.8 16.8 0 0 1-4.1 4.8" />
                      <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8" />
                      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                    </svg>
                  </button>
                </div>
                <p class="login__error" id="login-pw-err" data-error></p>
              </div>
              <button class="login__submit" type="submit">Iniciar sesión</button>
            </form>
          </div>

          <div class="login__live" role="status" aria-live="polite" data-live></div>
        </div>
      </div>
    </main>
    <script src="{% static 'js/login.js' %}" defer></script>
  </body>
</html>

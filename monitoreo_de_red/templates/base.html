{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme='dark'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoreo de Red</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            {% if user.is_authenticated %}
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{% url 'hosts' %}">Hosts</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'checks' %}">Chequeos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'alerts' %}">Alertas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" onclick="logout(); return false;">Cerrar Sesión</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <main class="container-fluid px-0">
      <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          {% block table_header %}
            <h4 class="mb-0">Monitoreo de Red</h4>
          {% endblock table_header %}
      </div>
      <div class='table-responsive'>
        {% block content %}

        {% endblock %}
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/logout.js' %}"></script>
  </body>
</html>

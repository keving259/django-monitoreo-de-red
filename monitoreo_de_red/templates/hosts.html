{% extends "base.html" %}
{% load static %}

  {% block content %}
    <div class="container mt-4">
      <div class='table-responsive'>
        <table class="table table-striped table-hover" id="tabla-hosts">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Hostname</th>
              <th scope="col">Tipo de Servicio</th>
              <th scope="col">Dirección IP</th>
              <th scope="col">Puerto</th>
              <th scope="col">Intervalo de Chequeo</th>
              <th scope="col">Estado</th>
              <th scope="col">Último chequeo</th>
              <th scope='col'>Acciones</th> 
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarLabel">Editar Host</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <form id="form-editar">
              <input type="hidden" id='editar-id'>
              <div class='mb-3'>
                <label for='editar-nombre' class='form-label'>Nombre</label>
                <input type='text' class='form-control' id='editar-nombre' required>
              </div>
              <div class='mb-3'>
                <label for='editar-hostname' class='form-label'>Hostname</label>
                <input type='text' class='form-control' id='editar-hostname' required>
              </div>
              <div class="mb-3">
                <label for="editar-ip" class="form-label">Dirección IP</label>
                <input type="text" class="form-control" id="editar-ip" required>
              </div>
              <div class="mb-3">
                <label for="editar-puerto" class="form-label">Puerto</label>
                <input type="number" class="form-control" id="editar-puerto" required>
              </div>
              <div class="mb-3">
                <label for="editar-activo" class='form-label'>Estado</label>
                <select class='form-select' id='editar-activo' required>
                  <option value='True'>Activo</option>
                  <option value='False'>Inactivo</option>
                </select>
              </div>
              <div id='editar-error' class="text-danger mt-2"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id='guardar-cambios' form="form-editar">Guardar cambios</button>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'js/hosts.js' %}" defer></script>
    {% endblock content %}
